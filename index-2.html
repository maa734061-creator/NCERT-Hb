<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NCERT Education Hub</title>
<style>
:root{--bg:#f6f8fc;--card:#fff;--tx:#1b2433;--mu:#667085;--pr:#2f6fed;--bd:#e2e7f0;--dn:#d93025;--fs:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141c;--card:#1a2030;--tx:#e8ecf4;--mu:#98a2b3;--pr:#6c9bff;--bd:#2a3246}}
:root[data-theme="dark"]{--bg:#10141c;--card:#1a2030;--tx:#e8ecf4;--mu:#98a2b3;--pr:#6c9bff;--bd:#2a3246}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs)/1.5 system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:1.1em;margin:0;flex:1}
header button{background:none;border:0;color:#fff;font-size:1.3em;cursor:pointer}
main{max-width:720px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer}
.card.big{text-align:center;font-weight:600;padding:26px 10px}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row span{flex:1;cursor:pointer}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
textarea{min-height:240px}
.add{display:flex;gap:8px;margin-bottom:14px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.del{background:none;border:0;color:var(--dn);cursor:pointer;font-size:1.1em}
.mu{color:var(--mu)}
h2{margin:6px 0 14px}
.crumb{color:var(--pr);cursor:pointer;margin-bottom:8px;display:inline-block}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd)}
nav{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px;color:var(--mu);font:inherit;cursor:pointer}
nav button.on{color:var(--pr);font-weight:600}
</style>
</head>

async function dk(pw,salt){var m=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encr(pw,obj){var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await dk(pw,salt),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},k,TE.encode(JSON.stringify(obj)))),o=new Uint8Array(28+ct.length);o.set(salt);o.set(iv,16);o.set(ct,28);return b2s(o)}
async function decr(pw,s){var o=s2b(s),k=await dk(pw,o.slice(0,16)),p=await crypto.subtle.decrypt({name:'AES-GCM',iv:o.slice(16,28)},k,o.slice(28));return JSON.parse(TD.decode(p))}
function msg(t){var e=document.getElementById('lm');if(e)e.textContent=t}
async function unlock(pw,first){
 try{
  if(SEED){D=await decr(pw,SEED)}else if(first){if(pw.length<4){msg('Use at least 4 characters');return}D={}}else return;
  PW=pw;U=true;try{localStorage.setItem('nch_pw',pw)}catch(e){}
  S.edit=OWNER;
  if(OWNER){try{var d=localStorage.getItem('nch_draft');if(d){D=JSON.parse(d);DIRTY=true}}catch(e){}
   if(dedupe())dd();if(!hasData()){loadDef();dd()}}
  render();
 }catch(e){msg('Wrong password')}
}
function logout(){try{localStorage.removeItem('nch_pw')}catch(e){}U=false;D={};PW='';V={v:'home'};render()}
async function pub(){
 try{
  var a=await claude.use('artifact');if(!a){NT='Could not publish';render();return}
  NT='Publishing, please wait...';render();var cl={},ev={};for(var i=0;i<CLASSES.length;i++){var k=CLASSES[i];cl[k]=[];for(var j=0;j<chs(k).length;j++){var ch=chs(k)[j],o={id:ch.id,name:ch.name,price:ch.price||''};if(ch.pw){o.lk=1;o.subs=ch.subs.map(function(s){return{id:s.id,name:s.name}});var m={};ch.subs.forEach(function(s){m[s.id]={body:s.body||'',files:s.files||[]}});ev[ch.id]=await encr(ch.pw,m)}else{o.subs=ch.subs}cl[k].push(o)}}var enc=await encr(PW,D),c=document.documentElement.cloneNode(true);
  c.removeAttribute('style');c.removeAttribute('data-theme');c.querySelector('#app').innerHTML='';c.querySelector('#seed').textContent=JSON.stringify({c:enc,p:{contact:D._contact||'',cl:cl},e:ev});
  try{localStorage.removeItem('nch_draft')}catch(e){}
  await a.publish('<!DOCTYPE html>\n'+c.outerHTML);
 }catch(e){NT='Could not publish: '+((e&&e.message)||'');render()}
}

async function autoOpen(){var q={};try{q=JSON.parse(localStorage.getItem('nch_cp')||'{}')}catch(e){}for(var c=0;c<CLASSES.length;c++){var L=chs(CLASSES[c]);for(var i=0;i<L.length;i++){var C=L[i];if(C.lk&&q[C.id]&&PENC[C.id]){try{mergeCh(C,await decr(q[C.id],PENC[C.id]))}catch(e){}}}}}
function addLink(){var u=document.getElementById('lk').value.trim();if(u.indexOf('http')!==0){NT='Link must start with http';render();return}var s=sub();s.body=document.getElementById('bd').value;s.files=s.files||[];s.files.push({id:'L'+(++IDC),name:u.length>40?u.slice(0,40)+'...':u,t:'link',url:u});dd();render()}

 var t=SEED?(OWNER?'🔒 Teacher login: enter your password':'🔒 Enter password to view content'):(OWNER?'First time: create your password (share it with students)':'Content coming soon.');

function filesHtml(s){return (s.files||[]).map(function(f){var d=S.edit?'<button class="del" onclick="delFile(\''+f.id+'\')">🗑</button>':'';
 if(f.t==='video')return '<div class="row"><div style="flex:1"><div>🎬 '+esc(f.name)+'</div><video controls preload="none" playsinline src="/_blob/'+f.id+'" style="width:100%;margin-top:6px"></video></div>'+d+'</div>';if(f.t==='link')return '<div class="row"><span>'+((f.url||'').indexOf('http')===0?'<a href="'+esc(f.url)+'" target="_blank" rel="noopener" style="color:var(--pr)">🔗 '+esc(f.name)+'</a>':esc(f.name))+'</span>'+d+'</div>';return f.t==='audio'?'<div class="row"><div style="flex:1"><div>🎧 '+esc(f.name)+'</div><audio controls preload="none" src="/_blob/'+f.id+'" style="width:100%;margin-top:6px"></audio></div>'+d+'</div>':'<div class="row"><span><a href="/_blob/'+f.id+'" target="_blank" rel="noopener" style="color:var(--pr)">📄 '+esc(f.name)+'</a></span>'+d+'</div>'}).join('')}
function render(){
 var a=document.getElementById('app'),h='';
 if(!U&&V.v!=='pri'){a.innerHTML=lockHtml();return}
 ['home','set','pri'].forEach(function(k){document.getElementById('n-'+k).className=(V.v===k||(k==='home'&&['cls','ch','sub'].indexOf(V.v)>-1))?'on':''});
 var bn=(OWNER&&DIRTY)?'<div class="row" style="background:var(--pr);color:#fff"><span>Changes not published yet</span><button class="btn sec" onclick="pub()">Publish</button></div>':'';
 if(V.v==='home'){h='<h2>Choose your class</h2><p class="mu">Science · NCERT</p><div class="grid">'+CLASSES.map(function(c){return '<div class="card big" onclick="go({v:\'cls\',c:'+c+'})">Class '+c+'</div>'}).join('')+'</div>'}
 else if(V.v==='cls'){var L=chs(V.c);h='<span class="crumb" onclick="go({v:\'home\'})">← Home</span><h2>Class '+V.c+' · Science chapters</h2>'+addBox('New chapter name','addCh')+(L.length?L.map(function(x,i){return '<div class="row"><span onclick="go({v:\'ch\',c:'+V.c+',h:'+x.id+'})">'+(i+1)+'. '+esc(x.name)+(x.lk||x.pw?' 🔒':'')+(x.price?' <small class="mu">'+esc(x.price)+'</small>':'')+'</span>'+(S.edit?'<button class="del" onclick="delCh('+x.id+')">🗑</button>':'')+'</div>'}).join(''):'<p class="mu">No chapters yet.</p>')}
 else if(V.v==='ch'){var C=chp();h='<span class="crumb" onclick="go({v:\'cls\',c:'+V.c+'})">← Class '+V.c+'</span><h2>'+esc(C.name)+'</h2>'+accBox(C)+addBox('New sub-topic','addSub')+(C.subs.length?C.subs.map(function(x,i){return '<div class="row"><span '+((C.lk&&!C.open&&!OWNER)?'':'onclick="go({v:\'sub\',c:'+V.c+',h:'+V.h+',s:'+x.id+'})"')+'>'+(i+1)+'. '+esc(x.name)+((x.files&&x.files.length)||x.body?' ✓':'')+'</span>'+(S.edit?'<button class="del" onclick="delSub('+x.id+')">🗑</button>':'')+'</div>'}).join(''):'<p class="mu">No sub-topics yet.</p>')}
 else if(V.v==='sub'){var T=sub();h='<span class="crumb" onclick="go({v:\'ch\',c:'+V.c+',h:'+V.h+'})">← '+esc(chp().name)+'</span><h2>'+esc(T.name)+'</h2>'+
  (S.edit?'<h3>Notes</h3><textarea id="bd" placeholder="Write notes here...">'+esc(T.body)+'</textarea><p><button class="btn" onclick="saveBody()">Save notes</button> <span id="ok" class="mu"></span></p><p><label class="btn sec" style="display:inline-block">＋ Audio<input type="file" accept="audio/*" hidden onchange="up(\'audio\',this)"></label> <label class="btn sec" style="display:inline-block">＋ PDF<input type="file" accept="application/pdf" hidden onchange="up(\'pdf\',this)"></label> <label class="btn sec" style="display:inline-block">＋ Video<input type="file" accept="video/*" hidden onchange="up(\'video\',this)"></label></p><div class="add"><input id="lk" placeholder="Paste a video / website link (YouTube, Drive...)"><button class="btn sec" onclick="addLink()">Add link</button></div>':(T.body?'<div style="white-space:pre-wrap;margin-bottom:14px">'+esc(T.body)+'</div>':''))+filesHtml(T)+((!S.edit&&!T.body&&!(T.files&&T.files.length))?'<p class="mu">Nothing added yet.</p>':'')}
 else if(V.v==='set'){h='<h2>Settings</h2><div class="set"><span>Theme</span><select id="th" onchange="S.theme=this.value;sv();applyS()"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="set"><span>Text size</span><input type="range" min="14" max="22" value="'+S.fs+'" style="width:50%" oninput="S.fs=+this.value;sv();applyS()"></div>'+
  (OWNER?'<div class="set"><span>Edit mode</span><input type="checkbox" style="width:auto" '+(S.edit?'checked':'')+' onchange="S.edit=this.checked;sv()"></div><div class="set"><input id="np" type="text" placeholder="New password" style="width:60%"><button class="btn sec" onclick="setPw()">Change</button></div><div class="set"><input id="ct" placeholder="Contact / payment info for students" value="'+esc(D._contact||'')+'" style="width:65%"><button class="btn sec" onclick="D._contact=document.getElementById(\'ct\').value;dd();NT=\'Saved. Tap Publish.\';render()">Save</button></div><div class="set" style="flex-direction:column;align-items:stretch"><span>Share link for students</span><input readonly value="'+LINK+'" onclick="this.select()" style="margin:6px 0"><button class="btn" onclick="copyLink()">Copy link</button></div><div class="set"><span>Load NCERT chapter list</span><button class="btn sec" onclick="loadAll()">Load</button></div><div class="set"><span>Publish for students</span><button class="btn" onclick="pub()">Publish</button></div>':'')+

 else{h='<h2>Privacy Policy</h2><p>NCERT Education Hub does not ask for personal information such as your name, phone number or email.</p><p>Content is encrypted and opens only with the correct password. Your password and settings are saved only on your device, and logging out removes the password.</p><p>The app has no ads and no tracking.</p><p class="mu">Contact: [add your email here]</p>'}
 var cfb=PEND?'<div class="row"><span>'+PMSG+'</span><button class="btn" onclick="yes()">Yes</button><button class="btn sec" onclick="no()">No</button></div>':(NT?'<div class="row"><span>'+esc(NT)+'</span><button class="btn sec" onclick="NT=\'\';render()">OK</button></div>':'');a.innerHTML=cfb+bn+h;
 var t=document.getElementById('th');if(t)t.value=S.theme;
}
