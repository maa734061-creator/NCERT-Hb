main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:16px 16px 28px}
h2{margin:8px 0 4px;font-size:1.45em;line-height:1.25;font-weight:800}

p{margin:0 0 12px}
.sub{margin:0 0 14px;font-size:.92em}
.mu{color:var(--mu)}

.hero{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;border-radius:20px;padding:20px 18px;margin:0 0 18px;box-shadow:var(--sh)}

.hero p{margin:0;opacity:.92;font-size:.95em}
.subj{--ac:#2f6fed;--acb:#e8f0ff;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.subj.soc{--ac:#d9480f;--acb:#fff0e6}
.subh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.subh small{color:var(--mu);display:block;font-size:.82em}
.sic{width:44px;height:44px;border-radius:14px;background:var(--acb);display:flex;align-items:center;justify-content:center;font-size:24px}
.grid3{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:var(--acb);border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;border:1px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.96)}
.tile small{display:block;color:var(--mu);font-size:.72em;text-transform:uppercase;letter-spacing:.05em}
.tile b{display:block;font-size:1.45em;color:var(--ac);line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;cursor:pointer}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch}
.tab{flex:1 0 auto;justify-content:center;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 11px;font-size:.95em;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.tab em{font-style:normal;font-size:.8em;background:var(--chip);color:var(--mu);border-radius:999px;padding:1px 8px}
.tab.on{background:var(--pr);border-color:var(--pr);color:#fff}
.tab.on em{background:rgba(255,255,255,.25);color:#fff}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.row.ch{padding:6px 8px 6px 6px}
.lnk{flex:1;display:flex;align-items:center;gap:12px;min-width:0;min-height:48px;cursor:pointer}
.lnk::after{content:"›";color:var(--mu);font-size:1.6em;line-height:1;margin-left:auto;padding-left:4px}
.num{flex:0 0 34px;height:34px;border-radius:10px;background:var(--chip);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:.92em}
.nm{flex:1;min-width:0;font-weight:600;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-style:normal;font-size:.78em;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--chip);color:var(--mu)}
.chip.price{background:var(--pc);color:var(--pt)}
.chip.ok{background:#e3f7ec;color:var(--ok)}
.row audio,.row video{width:100%;margin-top:8px}
.row a{color:var(--pr);font-weight:600;word-break:break-word}

select{width:auto;min-height:40px}
input[type=checkbox]{width:22px;min-height:22px;height:22px}

textarea{min-height:170px;line-height:1.5}
